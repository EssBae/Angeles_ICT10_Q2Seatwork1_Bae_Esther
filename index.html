<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork #1: Teacher Verification System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<style>
    body {
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        min-height: 100vh;
        align-items: center;
        padding: 70px;
        text-align: center;
    }

    .container {
        background-color: rgb(72, 83, 100);
        width: 55%;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    h1 {
        font-weight: bolder;
    }

    h2 {
        font-weight: light;
        margin-bottom: 40px;
    }

    p {
        margin-top: 18px;
        color: white;
    }

    .btn {
        width: 80%;
        background-color: rgb(42, 48, 58);
        color: white;
        margin-top: 20px;
        font-size: 25px;
        font-weight: bolder;
        transition: 0.2s;
        border: none;
    }
    .btn:hover {
        transform: translateY(-1px);
    }

    .btn:active {
        transform: translateY(1px) !important;
    }

    /* So that I can override Bootstrap's effects */

    .btn:hover,
    .btn:active {
        background-color: rgb(24, 28, 34) !important;
        color: white !important;
    }

    footer {
        background-color: rgb(42, 48, 58);;
        color: white;
        text-align: center;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;  
    }

</style>
<body>
    <h1> OBMC Angeles Junior High School Teachers Checker</h1>
    <h2> Verification System </h2>
    
    <div class="container">
        <input type="text" id="first_name" class="form-control mb-3" placeholder="Enter First Name">
        <input type="text" id="last_name" class="form-control mb-3" placeholder="Enter Last Name">

        <button type="button" class="btn" py-click="verify">VERIFY</button>

        <p id="result"></p>

        <py-script src="main.py"></py-script>
    
    </div>

    <footer>
        <p>&copy; 2026 Teacher Verification System | Bae, Esther </p>
    </footer>


</body>
</html>
